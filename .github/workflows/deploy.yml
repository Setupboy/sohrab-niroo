name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Require an explicit target directory
        env:
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          if [ -z "$REMOTE_DIR" ] || [ "$REMOTE_DIR" = "/" ]; then
            echo "::error::FTP_REMOTE_DIR is empty or '/'. Both sites share this"
            echo "::error::cluster, so deploying to the account root would scatter"
            echo "::error::files across them. Set it to sohrabniroo.com's own folder."
            exit 1
          fi
          echo "Deploying to: $REMOTE_DIR"

      - name: Upload dist over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
